<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Minha Lista · Compras 2026</title>
    
    <!-- Manifest e Assets -->
    <link rel="manifest" href="manifest.json">
    <link rel="shortcut icon" href="src/img/favicon.ico" type="image/x-icon">
    
    <!-- CSS Principal -->
    <link rel="stylesheet" href="src/css/index.css">
</head>
<body>
    <!-- Container de Notificações Toast -->
    <div id="toast-container" class="toast-container" aria-live="polite"></div>

    <!-- Modal de Confirmação -->
    <div id="confirm-modal" class="modal-overlay" style="display: none;">
        <div class="modal-card">
            <div class="modal-icon">⚠️</div>
            <h3 class="modal-title">Confirmar remoção</h3>
            <p class="modal-message" id="confirm-message">Tem certeza que deseja remover este item?</p>
            <div class="modal-actions">
                <button class="btn btn-cancel" id="confirm-cancel">Cancelar</button>
                <button class="btn btn-danger" id="confirm-ok">Remover</button>
            </div>
        </div>
    </div>

    <div class="app-container">
        <!-- Cabeçalho Moderno -->
        <header class="app-header">
            <div class="header-content">
                <div class="header-title-section">
                    <h1 class="app-titulo">Minha Lista</h1>
                    <span class="sync-badge" title="Sincronizado">🔄 Compartilhada</span>
                    <span class="item-count-badge" id="itemCount">0 itens</span>
                </div>
                <div class="header-actions">
                    <button class="theme-toggle" id="themeToggle" aria-label="Alternar tema">
                        <span class="theme-icon-light">☀️</span>
                        <span class="theme-icon-dark">🌙</span>
                    </button>
                    <button class="btn-icon" onclick="logout()" title="Sair da conta">
                        <span class="icon">↗️</span>
                        <span class="btn-text">Sair</span>
                    </button>
                </div>
            </div>
            
            <!-- Tabs de Múltiplas Listas -->
<div class="list-tabs" id="listTabs">
    <button class="tab-btn active" data-list="principal">
        <span class="tab-emoji">🏠</span>
        <span class="tab-name">Principal</span>
        <span class="tab-remove" data-list="principal" title="Remover lista">×</span>
    </button>
    <button class="tab-btn" data-list="feira">
        <span class="tab-emoji">🥬</span>
        <span class="tab-name">Feira</span>
        <span class="tab-remove" data-list="feira" title="Remover lista">×</span>
    </button>
    <button class="tab-btn" data-list="farmacia">
        <span class="tab-emoji">💊</span>
        <span class="tab-name">Farmácia</span>
        <span class="tab-remove" data-list="farmacia" title="Remover lista">×</span>
    </button>
    <button class="tab-btn tab-add" id="addTabBtn" title="Nova lista">+</button>
</div>
            
            <div class="header-divider"></div>
        </header>

        <!-- Conteúdo Principal -->
        <main class="app-main">
            <!-- Estado de Lista Vazia -->
            <div id="empty-state" class="empty-state" style="display: none;">
                <div class="empty-illustration">🛒✨</div>
                <h3>Sua lista está vazia</h3>
                <p>Adicione itens para começar a organizar suas compras.</p>
            </div>

            <!-- Resultados do Autocomplete/Histórico -->
            <div id="suggestions-container" class="suggestions-container" style="display: none;">
                <div class="suggestions-header">📋 Sugestões baseadas no histórico</div>
                <ul id="suggestions-list" class="suggestions-list"></ul>
            </div>

            <!-- Lista de Compras -->
            <ul id="lista" class="lista-compras">
                <!-- Itens serão inseridos via JS -->
            </ul>
        </main>

        <!-- Rodapé com Input de Adição -->
        <footer class="app-footer">
            <!-- Seletor de Categoria -->
            <div class="category-selector" id="categorySelector">
                <span class="category-label">Categoria:</span>
                <div class="category-chips">
                    <button class="category-chip active" data-category="geral">📦 Geral</button>
                    <button class="category-chip" data-category="frutas">🍎 Frutas</button>
                    <button class="category-chip" data-category="laticinios">🥛 Laticínios</button>
                    <button class="category-chip" data-category="limpeza">🧹 Limpeza</button>
                    <button class="category-chip" data-category="padaria">🥖 Padaria</button>
                    <button class="category-chip" data-category="acougue">🥩 Açougue</button>
                    <button class="category-chip" data-category="bebidas">🥤 Bebidas</button>
                    <button class="category-chip" data-category="higiene">🧴 Higiene</button>
                </div>
            </div>

            <div class="input-wrapper">
                <input type="text" id="item" class="input-add" placeholder="Adicionar novo item..." autocomplete="off" aria-label="Novo item">
                <button class="btn-add" id="btnAdd" aria-label="Adicionar item">
                    <span class="btn-add-text">Adicionar</span>
                    <span class="btn-add-icon">+</span>
                </button>
            </div>

            <!-- Indicador de Sincronização -->
            <div class="sync-indicator" id="syncIndicator">
                <span class="sync-dot"></span>
                <span class="sync-text">Todas as alterações salvas</span>
            </div>
        </footer>
    </div>

    <!-- Script de Tema (Anti-Flash) -->
    <script>
        (function() {
            const savedTheme = localStorage.getItem('theme');
            const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            
            if (savedTheme === 'dark' || (!savedTheme && systemPrefersDark)) {
                document.documentElement.setAttribute('data-theme', 'dark');
            } else {
                document.documentElement.setAttribute('data-theme', 'light');
            }
        })();
    </script>

    <!-- Scripts da Aplicação -->
    <script type="module" src="app.js"></script>
    <script>
        // Registro do Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/service-worker.js')
                    .then(registration => {
                        console.log('ServiceWorker registrado:', registration.scope);
                    })
                    .catch(error => {
                        console.log('Falha no ServiceWorker:', error);
                    });
            });
        }

        // Toggle de Tema
        const themeToggle = document.getElementById('themeToggle');
        
        function setTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('theme', theme);
        }
        
        if (themeToggle) {
            themeToggle.addEventListener('click', () => {
                const currentTheme = document.documentElement.getAttribute('data-theme');
                const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
                setTheme(newTheme);
            });
        }
        
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
            if (!localStorage.getItem('theme')) {
                setTheme(e.matches ? 'dark' : 'light');
            }
        });
    </script>
</body>
</html>
