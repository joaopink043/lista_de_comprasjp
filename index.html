<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Minha Lista · Compras 2026</title>
    
    <!-- Manifest e Assets -->
    <link rel="manifest" href="manifest.json">
    <link rel="shortcut icon" href="src/css/favicon.ico" type="image/x-icon">
    
    <!-- CSS Principal -->
    <link rel="stylesheet" href="src/css/index.css">
    
    <!-- Fonte Poppins será importada no CSS -->
</head>
<body>
    <div class="app-container">
        <!-- Cabeçalho Moderno -->
        <header class="app-header">
            <div class="header-content">
                <div class="header-title-section">
                    <h1 class="app-titulo">Minha Lista</h1>
                    <span class="sync-badge" title="Sincronizado">🔄 Compartilhada</span>
                </div>
                <div class="header-actions">
                    <button class="btn-icon" onclick="logout()" title="Sair da conta">
                        <span class="icon">↗️</span>
                        <span class="btn-text">Sair</span>
                    </button>
                </div>
            </div>
            <!-- Linha decorativa sutil -->
            <div class="header-divider"></div>
        </header>

        <!-- Conteúdo Principal -->
        <main class="app-main">
            <!-- Estado de Lista Vazia (escondido por padrão, mostrado via JS) -->
            <div id="empty-state" class="empty-state" style="display: none;">
                <div class="empty-illustration">🛒✨</div>
                <h3>Sua lista está vazia</h3>
                <p>Adicione itens para começar a organizar suas compras.</p>
            </div>

            <!-- Lista de Compras -->
            <ul id="lista" class="lista-compras">
                <!-- Os itens serão inseridos aqui via JS -->
                <!-- Exemplo de estrutura esperada (gerada pelo JS):
                <li class="item-card">
                    <label class="item-checkbox">
                        <input type="checkbox" class="checkbox-input">
                        <span class="checkbox-custom"></span>
                        <span class="item-text">Nome do Item</span>
                    </label>
                    <button class="btn-delete" onclick="removerItem(this)">🗑️</button>
                </li>
                -->
            </ul>
        </main>

        <!-- Rodapé com Input de Adição -->
        <footer class="app-footer">
            <div class="input-wrapper">
                <input type="text" id="item" class="input-add" placeholder="Adicionar novo item..." autocomplete="off" aria-label="Novo item">
                <button class="btn-add" onclick="adicionarItem()" aria-label="Adicionar item">
                    <span class="btn-add-text">Adicionar</span>
                    <span class="btn-add-icon">+</span>
                </button>
            </div>
        </footer>
    </div>

    <!-- Scripts -->
    <script type="module" src="app.js"></script>
    <script>
        // Registro do Service Worker (mantido)
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/service-worker.js')
                    .then(registration => {
                        console.log('ServiceWorker registrado com sucesso:', registration.scope);
                    })
                    .catch(error => {
                        console.log('Falha ao registrar o ServiceWorker:', error);
                    });
            });
        }

        // Pequeno ajuste para o estado vazio (pode ser movido para o app.js)
        // Apenas um fallback caso o app.js não controle isso ainda.
        function verificarEstadoVazio() {
            const lista = document.getElementById('lista');
            const emptyState = document.getElementById('empty-state');
            if (lista && emptyState) {
                if (lista.children.length === 0) {
                    emptyState.style.display = 'flex';
                } else {
                    emptyState.style.display = 'none';
                }
            }
        }
        
        // Observa mudanças na lista (para demonstração, idealmente no app.js)
        const observer = new MutationObserver(verificarEstadoVazio);
        window.addEventListener('DOMContentLoaded', () => {
            const lista = document.getElementById('lista');
            if (lista) {
                observer.observe(lista, { childList: true, subtree: true });
                verificarEstadoVazio();
            }
        });
    </script>
</body>
</html>
