<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Minha Lista · Compras 2026</title>
    
    <!-- Manifest e Assets -->
    <link rel="manifest" href="manifest.json">
    <link rel="shortcut icon" href="src/css/favicon.ico" type="image/x-icon">
    
    <!-- CSS Principal -->
    <link rel="stylesheet" href="src/css/index.css">
</head>
<body>
    <div class="app-container">
        <!-- Cabeçalho Moderno -->
        <header class="app-header">
            <div class="header-content">
                <div class="header-title-section">
                    <h1 class="app-titulo">Minha Lista</h1>
                    <span class="sync-badge" title="Sincronizado">🔄 Compartilhada</span>
                </div>
                <div class="header-actions">
                    <!-- Toggle de Tema no Header -->
                    <button class="theme-toggle" id="themeToggle" aria-label="Alternar tema">
                        <span class="theme-icon-light">☀️</span>
                        <span class="theme-icon-dark">🌙</span>
                    </button>
                    <button class="btn-icon" onclick="logout()" title="Sair da conta">
                        <span class="icon">↗️</span>
                        <span class="btn-text">Sair</span>
                    </button>
                </div>
            </div>
            <div class="header-divider"></div>
        </header>

        <!-- Conteúdo Principal -->
        <main class="app-main">
            <!-- Estado de Lista Vazia -->
            <div id="empty-state" class="empty-state" style="display: none;">
                <div class="empty-illustration">🛒✨</div>
                <h3>Sua lista está vazia</h3>
                <p>Adicione itens para começar a organizar suas compras.</p>
            </div>

            <!-- Lista de Compras -->
            <ul id="lista" class="lista-compras">
                <!-- Itens serão inseridos via JS -->
            </ul>
        </main>

        <!-- Rodapé com Input de Adição -->
        <footer class="app-footer">
            <div class="input-wrapper">
                <input type="text" id="item" class="input-add" placeholder="Adicionar novo item..." autocomplete="off" aria-label="Novo item">
                <button class="btn-add" onclick="adicionarItem()" aria-label="Adicionar item">
                    <span class="btn-add-text">Adicionar</span>
                    <span class="btn-add-icon">+</span>
                </button>
            </div>
        </footer>
    </div>

    <!-- Script de Tema (Anti-Flash) -->
    <script>
        (function() {
            const savedTheme = localStorage.getItem('theme');
            const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            
            if (savedTheme === 'dark' || (!savedTheme && systemPrefersDark)) {
                document.documentElement.setAttribute('data-theme', 'dark');
            } else {
                document.documentElement.setAttribute('data-theme', 'light');
            }
        })();
    </script>

    <!-- Scripts da Aplicação -->
    <script type="module" src="app.js"></script>
    <script>
        // Registro do Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/service-worker.js')
                    .then(registration => {
                        console.log('ServiceWorker registrado:', registration.scope);
                    })
                    .catch(error => {
                        console.log('Falha no ServiceWorker:', error);
                    });
            });
        }

        // Toggle de Tema
        const themeToggle = document.getElementById('themeToggle');
        
        function setTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('theme', theme);
        }
        
        if (themeToggle) {
            themeToggle.addEventListener('click', () => {
                const currentTheme = document.documentElement.getAttribute('data-theme');
                const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
                setTheme(newTheme);
            });
        }
        
        // Sincroniza com sistema
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
            if (!localStorage.getItem('theme')) {
                setTheme(e.matches ? 'dark' : 'light');
            }
        });

        // Gerenciamento do Estado Vazio
        function verificarEstadoVazio() {
            const lista = document.getElementById('lista');
            const emptyState = document.getElementById('empty-state');
            if (lista && emptyState) {
                if (lista.children.length === 0) {
                    emptyState.style.display = 'flex';
                } else {
                    emptyState.style.display = 'none';
                }
            }
        }
        
        const observer = new MutationObserver(verificarEstadoVazio);
        window.addEventListener('DOMContentLoaded', () => {
            const lista = document.getElementById('lista');
            if (lista) {
                observer.observe(lista, { childList: true, subtree: true });
                verificarEstadoVazio();
            }
        });
    </script>
</body>
</html>
