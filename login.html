<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista Compartilhada · Login</title>
    
    <!-- Manifest e Assets -->
    <link rel="manifest" href="manifest.json">
    <link rel="shortcut icon" href="src/img/favicon.ico" type="image/x-icon">
    
    <!-- CSS Principal -->
    <link rel="stylesheet" href="src/css/login.css">
</head>
<body>
    <!-- Elementos decorativos de fundo -->
    <div class="bg-decoration">
        <div class="bg-circle bg-circle-1"></div>
        <div class="bg-circle bg-circle-2"></div>
    </div>

    <!-- Toggle de Tema (Flutuante) -->
    <button class="theme-toggle" id="themeToggle" aria-label="Alternar tema">
        <span class="theme-icon-light">☀️</span>
        <span class="theme-icon-dark">🌙</span>
    </button>

    <div class="container">
        <!-- Header com Logo e Boas-vindas -->
        <div class="login-header">
            <div class="logo-wrapper">
                <img id="logo" src="src/icons/icon-512x512.png" alt="Logo Lista de Compras">
            </div>
            <h1 class="titulo">Bem-vindo de volta</h1>
            <p class="subtitulo">Acesse sua lista compartilhada para continuar de onde parou.</p>
        </div>

        <!-- Formulário de Login -->
        <form id="login-form" class="login-form" onsubmit="event.preventDefault(); login();">
            <!-- Campo Email -->
            <div class="input-group">
                <span class="input-icon">✉️</span>
                <div class="input-field-wrapper">
                    <input type="email" id="email" class="input-field" placeholder=" " required>
                    <label for="email" class="input-label">E-mail</label>
                </div>
            </div>

            <!-- Campo Senha -->
            <div class="input-group">
                <span class="input-icon">🔒</span>
                <div class="input-field-wrapper">
                    <input type="password" id="senha" class="input-field" placeholder=" " required>
                    <label for="senha" class="input-label">Senha</label>
                </div>
            </div>

            <!-- Link Esqueceu a Senha -->
            <div class="forgot-password">
                <a href="#">Esqueceu a senha?</a>
            </div>

            <!-- Botões de Ação -->
            <div class="botoes">
                <button type="submit" class="btn btn-primary">Entrar na conta</button>
                <button type="button" class="btn btn-secondary" onclick="cadastro()">Criar uma conta gratuita</button>
            </div>
        </form>

        <!-- Footer -->
        <footer class="login-footer">
            <p>Lista de Compras 3°SIS · v1.0</p>
        </footer>
    </div>

    <!-- Script de Tema (antes do auth.js para evitar flash) -->
    <script>
        (function() {
            // Aplica o tema antes da renderização para evitar FOUC (Flash of Unstyled Content)
            const savedTheme = localStorage.getItem('theme');
            const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            
            if (savedTheme === 'dark' || (!savedTheme && systemPrefersDark)) {
                document.documentElement.setAttribute('data-theme', 'dark');
            } else {
                document.documentElement.setAttribute('data-theme', 'light');
            }
        })();
    </script>
    <script type="module" src="auth.js"></script>
    <script>
        // Toggle de Tema (pode ser movido para um arquivo separado)
        const themeToggle = document.getElementById('themeToggle');
        
        function setTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('theme', theme);
        }
        
        themeToggle.addEventListener('click', () => {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            setTheme(newTheme);
        });
        
        // Sincroniza com mudanças do sistema (opcional)
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
            if (!localStorage.getItem('theme')) {
                setTheme(e.matches ? 'dark' : 'light');
            }
        });
    </script>
</body>
</html>
